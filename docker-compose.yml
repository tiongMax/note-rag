services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: note-rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langchain}
      POSTGRES_DB: ${POSTGRES_DB:-langchain}
    ports:
      - "6024:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-langchain} -d ${POSTGRES_DB:-langchain}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note-rag-app
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-langchain}:${POSTGRES_PASSWORD:-langchain}@postgres:5432/${POSTGRES_DB:-langchain}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-gemini}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-3.5-flash}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.1}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1024}
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
      ALLOW_UNGUARDED_CHAT_IN_PRODUCTION: ${ALLOW_UNGUARDED_CHAT_IN_PRODUCTION:-false}
      CHAT_INPUT_MAX_TOKENS: ${CHAT_INPUT_MAX_TOKENS:-512}
      CHAT_PROMPT_MAX_TOKENS: ${CHAT_PROMPT_MAX_TOKENS:-4096}
      CHAT_PROMPT_RESERVE_TOKENS: ${CHAT_PROMPT_RESERVE_TOKENS:-128}
      CHAT_MEMORY_RECENT_TURNS: ${CHAT_MEMORY_RECENT_TURNS:-4}
      CHAT_MEMORY_SEMANTIC_K: ${CHAT_MEMORY_SEMANTIC_K:-2}
      CHAT_MEMORY_SEMANTIC_MIN_SIMILARITY: ${CHAT_MEMORY_SEMANTIC_MIN_SIMILARITY:-0.25}
      CHAT_MEMORY_SUMMARY_MAX_TOKENS: ${CHAT_MEMORY_SUMMARY_MAX_TOKENS:-64}
      CHAT_OUTPUT_HARD_MAX_TOKENS: ${CHAT_OUTPUT_HARD_MAX_TOKENS:-1024}
      GUARDRAIL_GROUNDEDNESS_THRESHOLD: ${GUARDRAIL_GROUNDEDNESS_THRESHOLD:-0.45}
      GUARDRAIL_RELEVANCE_THRESHOLD: ${GUARDRAIL_RELEVANCE_THRESHOLD:-0.05}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-30}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      BENCHMARK_EMBEDDING_DELAY_MS: ${BENCHMARK_EMBEDDING_DELAY_MS:-500}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      CHUNKING_STRATEGY: ${CHUNKING_STRATEGY:-recursive}
      CHUNK_SIZE: ${CHUNK_SIZE:-200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-20}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      EMBEDDING_CACHE_ENABLED: ${EMBEDDING_CACHE_ENABLED:-true}
      RETRIEVAL_CACHE_ENABLED: ${RETRIEVAL_CACHE_ENABLED:-true}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-3600}
      RETRIEVAL_LEXICAL_BACKEND: ${RETRIEVAL_LEXICAL_BACKEND:-bm25}
      RETRIEVAL_BM25_K1: ${RETRIEVAL_BM25_K1:-1.5}
      RETRIEVAL_BM25_B: ${RETRIEVAL_BM25_B:-0.75}
      RERANK_WEIGHT: ${RERANK_WEIGHT:-0.7}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOAD_STORAGE_PATH: /app/data/uploads
      FRONTEND_DIST_PATH: /app/frontend/dist
      JSON_LOGS: ${JSON_LOGS:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${APP_PORT:-8001}:8001"
    volumes:
      - note_rag_uploads:/app/data/uploads
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres-recursive:
    profiles: ["benchmark"]
    image: pgvector/pgvector:pg16
    container_name: note-rag-postgres-recursive
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langchain}
      POSTGRES_DB: ${POSTGRES_DB:-langchain}
    ports:
      - "${RECURSIVE_POSTGRES_PORT:-6025}:5432"
    volumes:
      - pgvector_recursive_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-langchain} -d ${POSTGRES_DB:-langchain}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app-recursive:
    profiles: ["benchmark"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note-rag-app-recursive
    init: true
    restart: unless-stopped
    depends_on:
      postgres-recursive:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-langchain}:${POSTGRES_PASSWORD:-langchain}@postgres-recursive:5432/${POSTGRES_DB:-langchain}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-gemini}
      CHAT_MODEL: ${CHAT_MODEL:-gemini-3.5-flash}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.1}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1024}
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
      ALLOW_UNGUARDED_CHAT_IN_PRODUCTION: ${ALLOW_UNGUARDED_CHAT_IN_PRODUCTION:-false}
      CHAT_INPUT_MAX_TOKENS: ${CHAT_INPUT_MAX_TOKENS:-512}
      CHAT_PROMPT_MAX_TOKENS: ${CHAT_PROMPT_MAX_TOKENS:-4096}
      CHAT_PROMPT_RESERVE_TOKENS: ${CHAT_PROMPT_RESERVE_TOKENS:-128}
      CHAT_MEMORY_RECENT_TURNS: ${CHAT_MEMORY_RECENT_TURNS:-4}
      CHAT_MEMORY_SEMANTIC_K: ${CHAT_MEMORY_SEMANTIC_K:-2}
      CHAT_MEMORY_SEMANTIC_MIN_SIMILARITY: ${CHAT_MEMORY_SEMANTIC_MIN_SIMILARITY:-0.25}
      CHAT_MEMORY_SUMMARY_MAX_TOKENS: ${CHAT_MEMORY_SUMMARY_MAX_TOKENS:-64}
      CHAT_OUTPUT_HARD_MAX_TOKENS: ${CHAT_OUTPUT_HARD_MAX_TOKENS:-1024}
      GUARDRAIL_GROUNDEDNESS_THRESHOLD: ${GUARDRAIL_GROUNDEDNESS_THRESHOLD:-0.45}
      GUARDRAIL_RELEVANCE_THRESHOLD: ${GUARDRAIL_RELEVANCE_THRESHOLD:-0.05}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-30}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      BENCHMARK_EMBEDDING_DELAY_MS: ${BENCHMARK_EMBEDDING_DELAY_MS:-500}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      CHUNKING_STRATEGY: recursive
      CHUNK_SIZE: ${CHUNK_SIZE:-200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-20}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      EMBEDDING_CACHE_ENABLED: ${EMBEDDING_CACHE_ENABLED:-true}
      RETRIEVAL_CACHE_ENABLED: ${RETRIEVAL_CACHE_ENABLED:-true}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-3600}
      RETRIEVAL_LEXICAL_BACKEND: ${RETRIEVAL_LEXICAL_BACKEND:-bm25}
      RETRIEVAL_BM25_K1: ${RETRIEVAL_BM25_K1:-1.5}
      RETRIEVAL_BM25_B: ${RETRIEVAL_BM25_B:-0.75}
      RERANK_WEIGHT: ${RERANK_WEIGHT:-0.7}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOAD_STORAGE_PATH: /app/data/uploads
      FRONTEND_DIST_PATH: /app/frontend/dist
      JSON_LOGS: ${JSON_LOGS:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${RECURSIVE_APP_PORT:-8002}:8001"
    volumes:
      - note_rag_recursive_uploads:/app/data/uploads
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgvector_data:
  note_rag_uploads:
  pgvector_recursive_data:
  note_rag_recursive_uploads:
