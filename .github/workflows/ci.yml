name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: langchain
          POSTGRES_PASSWORD: langchain
          POSTGRES_DB: langchain
        ports:
          - 6024:5432
        options: >-
          --health-cmd "pg_isready -U langchain -d langchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://langchain:langchain@localhost:6024/langchain
      DATABASE_URL: postgresql+psycopg://langchain:langchain@localhost:6024/langchain
      BACKGROUND_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Validate migrations
        run: |
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python -m alembic downgrade base
          .venv/bin/python -m alembic upgrade head
      - name: Lint and type check
        run: |
          .venv/bin/ruff check src tests migrations
          .venv/bin/pyright
      - name: Test
        run: .venv/bin/python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: note-rag:ci
