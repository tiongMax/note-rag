[project]
name = "note-rag"
version = "0.1.0"
description = "A small, phase-by-phase RAG implementation inspired by RAGFlow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "langchain==1.3.13",
    "langchain-community==0.4.2",
    "langchain-google-genai==4.2.7",
    "langchain-postgres==0.0.17",
    "langchain-text-splitters==1.1.2",
    "pgvector==0.3.6",
    "psycopg[binary]==3.3.4",
    "pydantic>=2,<3",
    "pypdf==6.14.2",
    "python-dotenv==1.2.2",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.6.0",
    "SQLAlchemy==2.0.51",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
note-rag = "note_rag.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_rag"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
