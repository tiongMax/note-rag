[project]
name = "note-rag"
version = "0.1.0"
description = "A small, phase-by-phase RAG implementation inspired by RAGFlow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "google-genai>=2.12,<3",
    "pgvector>=0.3.6,<1",
    "psycopg[binary]==3.3.4",
    "pydantic>=2,<3",
    "pypdf==6.14.2",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "SQLAlchemy==2.0.51",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1,<2",
    "ruff>=0.12,<1",
]
reranking = [
    "sentence-transformers>=5,<6",
]

[project.scripts]
note-rag = "note_rag.api.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_rag"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
