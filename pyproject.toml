[project]
name = "note-rag"
version = "0.1.0"
description = "Phase 1 LCEL RAG baseline using Gemini and PostgreSQL/pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pyright]
include = ["main.py"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
